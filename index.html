  :root:not([data-theme="light"]){
    --bg:#190A10; --sup:#241018; --sup2:#301521;
    --ink:#F3E4DC; --ink2:#C6A7AF; --ink3:#9A7F87;
    --linha:#3B1B25; --linha-forte:#51242F;
    --ok:#7BB68C; --ok-bg:#1E3527;
    --atencao:#E0B060; --atencao-bg:#3A2A12;
    --falta:#E58A72; --falta-bg:#3E1C16;
    --acento:#DDAA58; --sobre-acento:#2A0E16;
    --barra:#2E0F1B; --barra-ink:#F3E3DA; --barra-ink2:#B08E99;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#190A10; --sup:#241018; --sup2:#301521;
  --ink:#F3E4DC; --ink2:#C6A7AF; --ink3:#9A7F87;
  --linha:#3B1B25; --linha-forte:#51242F;
  --ok:#7BB68C; --ok-bg:#1E3527;
  --atencao:#E0B060; --atencao-bg:#3A2A12;
  --falta:#E58A72; --falta-bg:#3E1C16;
  --acento:#DDAA58; --sobre-acento:#2A0E16;
  --barra:#2E0F1B; --barra-ink:#F3E3DA; --barra-ink2:#B08E99;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.8);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Karla,"Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Bodoni Moda",Didot,Georgia,serif; font-weight:700; margin:0; text-wrap:balance; letter-spacing:-.01em}
h1{font-size:26px; line-height:1.15}
h2{font-size:19px; line-height:1.25}
h3{font-size:16px; line-height:1.3}
p{margin:0}
button{font:inherit; color:inherit}
input,select,textarea{font:inherit; color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--acento); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important}}

/* ---------- shell ---------- */
#app{display:flex; flex-direction:column; min-height:100%}
.topo{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--barra); color:var(--barra-ink);
  display:flex; align-items:center; gap:12px;
  padding:10px 16px; border-bottom:1px solid rgba(217,164,65,.22);
}
.topo .marca{display:flex; align-items:center; gap:10px; min-width:0}
.topo .logo{width:38px; height:38px; flex:none; border-radius:10px; display:block}
.topo .nome{font-family:"Bodoni Moda",Georgia,serif; font-weight:700; font-size:17px; letter-spacing:.02em; white-space:nowrap}
.topo .sec{font-size:12px; color:var(--barra-ink2); letter-spacing:.09em; text-transform:uppercase; margin-top:-2px}
.topo .dir{margin-left:auto; display:flex; gap:6px; align-items:center}
.icobtn{
  background:rgba(245,235,227,.09); border:1px solid rgba(245,235,227,.14);
  color:var(--barra-ink); width:36px; height:36px; border-radius:10px;
  display:grid; place-items:center; cursor:pointer;
}
.icobtn:hover{background:rgba(245,235,227,.18)}
.icobtn svg{width:18px; height:18px}

main{flex:1; width:100%; max-width:780px; margin:0 auto; padding:14px 16px 92px}

/* ---------- nav ---------- */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--sup); border-top:1px solid var(--linha);
  display:grid; grid-template-columns:repeat(5,1fr);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
}
.nav button{
  background:none; border:0; cursor:pointer; padding:5px 2px 4px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10.5px; letter-spacing:.03em; color:var(--ink3); border-radius:10px;
}
.nav button svg{width:21px; height:21px; stroke-width:1.7}
.nav button[aria-selected="true"]{color:var(--acento); font-weight:700}
.nav button[aria-selected="true"] svg{stroke-width:2.2}

@media (min-width:900px){
  #app{flex-direction:row}
  .topo{position:fixed; top:0; left:0; right:0; z-index:50; padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .nav{
    position:fixed; top:0; bottom:0; left:0; right:auto; width:212px;
    grid-template-columns:1fr; align-content:start; gap:2px;
    border-top:0; border-right:1px solid var(--linha);
    padding:calc(72px + env(safe-area-inset-top,0px)) 12px 12px;
    background:var(--sup2);
  }
  .nav button{flex-direction:row; justify-content:flex-start; gap:11px; font-size:14px; padding:10px 12px}
  .nav button[aria-selected="true"]{background:var(--sup); box-shadow:var(--sombra)}
  main{margin-left:212px; padding-top:calc(86px + env(safe-area-inset-top,0px)); padding-bottom:40px; max-width:820px}
}

/* ---------- peças ---------- */
.card{background:var(--sup); border:1px solid var(--linha); border-radius:var(--r-lg); padding:16px}
.pilha{display:flex; flex-direction:column; gap:14px}
.linha{display:flex; align-items:center; gap:10px}
.entre{display:flex; align-items:center; justify-content:space-between; gap:10px}
.rotulo{font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink3); font-weight:700}
.sub{color:var(--ink2); font-size:13.5px}
.vazio{color:var(--ink3); font-size:14px; padding:20px 4px; text-align:center; font-style:italic}

.titulo-sec{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.titulo-sec > .linha{flex-wrap:wrap}

.btn{
  background:var(--acento); color:var(--sobre-acento); border:1px solid transparent;
  padding:9px 15px; border-radius:var(--r); font-weight:700; font-size:14px; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px;
}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--sup); color:var(--ink); border-color:var(--linha-forte)}
.btn.sec:hover{background:var(--sup2); filter:none}
.btn.fant{background:none; border-color:transparent; color:var(--acento); padding:6px 8px}
.btn.peq{padding:6px 11px; font-size:13px}
.btn.larg{width:100%; justify-content:center}
.btn svg{width:16px; height:16px}

.chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
  padding:3px 9px; border-radius:999px; letter-spacing:.02em;
  background:var(--sup2); color:var(--ink2); border:1px solid var(--linha);
}
.chip.ok{background:var(--ok-bg); color:var(--ok); border-color:transparent}
.chip.atencao{background:var(--atencao-bg); color:var(--atencao); border-color:transparent}
.chip.falta{background:var(--falta-bg); color:var(--falta); border-color:transparent}

label.campo{display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:700; color:var(--ink2); letter-spacing:.03em}
.campo input,.campo select,.campo textarea{
  background:var(--sup); border:1px solid var(--linha-forte); border-radius:var(--r-sm);
  padding:9px 10px; font-weight:400; font-size:15px; color:var(--ink); width:100%;
}
.campo textarea{min-height:96px; resize:vertical; line-height:1.55}
.grade2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grade3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
@media (max-width:430px){.grade3{grid-template-columns:1fr 1fr}}

/* itens de lista — linhas dentro de um bloco, não um cartão por linha */
.bloco{background:var(--sup); border:1px solid var(--linha); border-radius:var(--r); overflow:hidden}
.bloco > .item{border:0; border-radius:0; background:none}
.bloco > .item + .item{border-top:1px solid var(--linha); margin-top:0}
.item{
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  background:var(--sup); border:1px solid var(--linha); border-radius:var(--r);
  width:100%; text-align:left;
}
.item + .item{margin-top:6px}
.item .nome{flex:1; min-width:0; font-weight:600; line-height:1.35}
.item .nome small{display:block; font-weight:400; color:var(--ink3); font-size:12px; line-height:1.3}
.item .qtd{font-size:13.5px; color:var(--ink2); white-space:nowrap}
.item.clic{cursor:pointer}
.item.clic:active{background:var(--sup2)}

.grupo{margin-top:15px}
.grupo > .rotulo{margin-bottom:6px; color:var(--acento)}

/* marca de estado à esquerda */
.faixa{box-shadow:inset 3px 0 0 var(--linha-forte)}
.faixa.ok{box-shadow:inset 3px 0 0 var(--ok)}
.faixa.atencao{box-shadow:inset 3px 0 0 var(--atencao)}
.faixa.falta{box-shadow:inset 3px 0 0 var(--falta)}

/* cardápio */
.dia{background:var(--sup); border:1px solid var(--linha); border-radius:var(--r); padding:12px 13px}
.dia + .dia{margin-top:8px}
.dia.hoje{border-color:var(--acento); box-shadow:0 0 0 1px var(--acento)}
.dia h3{font-family:Karla,sans-serif; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2)}
.dia.hoje h3{color:var(--acento)}
.refeicao{display:flex; align-items:flex-start; gap:9px; padding:7px 0}
.refeicao + .refeicao{border-top:1px dashed var(--linha)}
.refeicao .tag{font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink3); width:52px; flex:none; padding-top:3px}
.refeicao .pratos{flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:5px}
.prato{
  background:var(--sup2); border:1px solid var(--linha); border-radius:999px;
  padding:3px 10px; font-size:13px; display:inline-flex; align-items:center; gap:6px;
}
.prato button{background:none; border:0; cursor:pointer; color:var(--ink3); font-size:15px; line-height:1; padding:0}
.refeicao.feita .pratos{opacity:.5}

/* tabela rancho */
.tabela{width:100%; border-collapse:collapse; font-size:14px}
.tabela th{text-align:left; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3); padding:6px 8px; border-bottom:1px solid var(--linha)}
.tabela td{padding:7px 8px; border-bottom:1px solid var(--linha)}
.tabela input{width:78px; padding:5px 7px; text-align:right}
.rolagem{overflow-x:auto}

/* check de compra */
.check{width:21px; height:21px; flex:none; border:1.8px solid var(--linha-forte); border-radius:5px; background:var(--sup); cursor:pointer; display:grid; place-items:center; padding:0}
.check[aria-pressed="true"]{background:var(--ok); border-color:var(--ok)}
.check svg{width:13px; height:13px; stroke:#fff; stroke-width:3; opacity:0}
.check[aria-pressed="true"] svg{opacity:1}
.item.marcado .nome{text-decoration:line-through; color:var(--ink3)}

/* modal */
.fundo{position:fixed; inset:0; background:rgba(30,10,16,.55); z-index:60; display:flex; align-items:flex-end; justify-content:center; padding:0}
.folha{
  background:var(--bg); width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
  border-radius:var(--r-lg) var(--r-lg) 0 0; padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));
  border:1px solid var(--linha); border-bottom:0;
}
@media (min-width:640px){
  .fundo{align-items:center; padding:20px}
  .folha{border-radius:var(--r-lg); border-bottom:1px solid var(--linha)}
}
.folha .entre{margin-bottom:14px}

/* aviso */
.aviso{
  background:var(--atencao-bg); color:var(--atencao); border-radius:var(--r);
  padding:10px 12px; font-size:13px; font-weight:600; display:flex; gap:9px; align-items:flex-start;
}
.aviso svg{width:16px; height:16px; flex:none; margin-top:2px}
.aviso.erro{background:var(--falta-bg); color:var(--falta)}
.aviso.info{background:var(--sup2); color:var(--ink2)}

/* toast */
#toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(82px + env(safe-area-inset-bottom,0px));
  background:var(--vinho-esc); color:var(--creme); padding:11px 16px; border-radius:var(--r);
  font-size:14px; font-weight:600; z-index:80; box-shadow:0 8px 28px -10px rgba(0,0,0,.5);
  display:flex; align-items:center; gap:12px; max-width:calc(100% - 32px);
}
#toast button{background:none; border:0; color:var(--ouro-claro); font-weight:700; cursor:pointer; white-space:nowrap}
@media (min-width:900px){#toast{bottom:24px; left:calc(212px + 50%); transform:translateX(-50%)}}

/* login */
.porta{min-height:100%; display:grid; place-items:center; padding:28px 16px; background:var(--barra)}
.porta .caixa{width:100%; max-width:360px; display:flex; flex-direction:column; gap:16px; align-items:center; text-align:center}
.porta .logo{width:104px; height:104px; border-radius:26px}
.porta h1{color:var(--creme); font-size:30px}
.porta .sub{color:var(--barra-ink2)}
.porta .linkzinho{background:none; border:0; color:var(--barra-ink2); font-size:13px; text-decoration:underline; cursor:pointer}
.porta .erro{color:#F0A08C; font-size:13px; font-weight:600; min-height:18px}

.pontos{display:flex; gap:16px; justify-content:center}
.pontos span{width:15px; height:15px; border-radius:50%; border:2px solid rgba(245,235,227,.4); transition:background .12s, border-color .12s}
.pontos span.on{background:var(--ouro-claro); border-color:var(--ouro-claro)}
.pontos.sacode{animation:sacode .4s}
@keyframes sacode{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

.teclado{display:grid; grid-template-columns:repeat(3,1fr); gap:11px; width:100%; max-width:296px}
.teclado button{
  height:62px; border-radius:17px; font-size:23px; font-weight:500; cursor:pointer;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
  background:rgba(245,235,227,.08); border:1px solid rgba(245,235,227,.15); color:var(--creme);
}
.teclado button:active{background:rgba(245,235,227,.22)}
.teclado button.vazio{visibility:hidden}
.teclado button.acao{font-size:19px}
.porta.ocupada .teclado{opacity:.45; pointer-events:none}

/* ---------- impressão ---------- */
#folha-impressa{display:none}
@media print{
  @page{margin:14mm}
  .topo,.nav,#toast,.fundo,main{display:none!important}
  body{background:#fff; color:#000; font-size:12pt}
  #folha-impressa{display:block}
  #folha-impressa h1{font-size:20pt; margin-bottom:2pt}
  #folha-impressa .meta{font-size:10pt; color:#444; margin-bottom:14pt; border-bottom:1pt solid #999; padding-bottom:6pt}
  #folha-impressa .cat{font-size:10pt; font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin:12pt 0 4pt; border-bottom:.5pt solid #bbb}
  #folha-impressa table{width:100%; border-collapse:collapse}
  #folha-impressa td{padding:5pt 4pt; border-bottom:.5pt dotted #aaa; vertical-align:bottom}
  #folha-impressa td.box{width:16pt}
  #folha-impressa td.box span{display:inline-block; width:11pt; height:11pt; border:1pt solid #333}
  #folha-impressa td.q{width:84pt; text-align:right; font-family:"IBM Plex Mono",monospace; font-size:10pt}
  #folha-impressa td.p{width:70pt; border-bottom:.5pt solid #777}
  #folha-impressa .rodape{margin-top:16pt; font-size:9pt; color:#666; display:flex; justify-content:space-between}
}
</style>

/* -------------------- unidades -------------------- */
// Toda quantidade é guardada na unidade-base do ingrediente:
// massa -> g | volume -> ml | contagem -> un
const UNIDADES = {
  massa:    [["g",1],["kg",1000]],
  volume:   [["ml",1],["L",1000]],
  contagem: [["un",1],["dz",12]]
};
// equivalências caseiras, só aparecem se o ingrediente declarar o fator
const CASEIRAS = [["xíc",  "xic"],["col. sopa","cs"],["col. chá","cc"]];

function unidadesDe(ing){
  const base = UNIDADES[ing.tipo].slice();
  if (ing.xic) base.push(["xíc", ing.xic]);
  if (ing.cs)  base.push(["col. sopa", ing.cs]);
  return base;
}
function paraBase(valor, rotulo, ing){
  const u = unidadesDe(ing).find(u => u[0] === rotulo);
  return Math.round(valor * (u ? u[1] : 1));
}
function fmt(n){
  const r = Math.round(n * 100) / 100;
  return String(r).replace(".", ",");
}
function mostrarBase(qtdBase, ing){
  if (ing.tipo === "contagem") return fmt(qtdBase) + " un";
  const grande = ing.tipo === "massa" ? ["kg", 1000, "g"] : ["L", 1000, "ml"];
  if (qtdBase >= grande[1]) return fmt(qtdBase / grande[1]) + " " + grande[0];
  return fmt(qtdBase) + " " + grande[2];
}
/** "0 / 2 kg" em vez de "0 g / 2 kg" — os dois lados na mesma unidade */
function mostrarPar(a, b, ing){
  if (ing.tipo === "contagem") return fmt(a) + " / " + fmt(b) + " un";
  const grande = ing.tipo === "massa" ? ["kg", 1000] : ["L", 1000];
  const peq = ing.tipo === "massa" ? "g" : "ml";
  if (b >= grande[1]) return fmt(a / grande[1]) + " / " + fmt(b / grande[1]) + " " + grande[0];
  return fmt(a) + " / " + fmt(b) + " " + peq;
}
/** arredonda para uma quantidade que dá pra comprar no mercado */
function compravel(qtdBase, ing){
  if (ing.tipo === "contagem") return Math.ceil(qtdBase);
  if (qtdBase >= 1000) return Math.ceil(qtdBase / 100) * 100;
  return Math.ceil(qtdBase / 10) * 10;
}

/* -------------------- texto / casamento -------------------- */
function norm(s){
  return (s || "").toString().toLowerCase().normalize("NFD")
    .replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/g, " ")
    .replace(/\s+/g, " ").trim();
}
function singular(s){ return s.replace(/(oes|aes|ais|eis|ns|s)$/, m => m === "oes" ? "ao" : (m === "ns" ? "m" : "")); }
function chaveBusca(s){ return norm(s).split(" ").map(singular).join(" "); }

/** acha o ingrediente do catálogo por nome ou apelido; nunca por string solta */
function acharIngrediente(texto){
  const k = chaveBusca(texto);
  if (!k) return null;
  for (const ing of S.ingredientes){
    if (chaveBusca(ing.nome) === k) return ing;
    if ((ing.apelidos || []).some(a => chaveBusca(a) === k)) return ing;
  }
  return null;
}
/** sugestões por prefixo/contém, para o autocompletar e o "você quis dizer" */
function sugerir(texto, max){
  const k = chaveBusca(texto);
  if (!k) return [];
  const pont = ing => {
    const alvos = [ing.nome, ...(ing.apelidos || [])].map(chaveBusca);
    let melhor = -1;
    for (const a of alvos){
      if (a === k) melhor = Math.max(melhor, 100);
      else if (a.startsWith(k)) melhor = Math.max(melhor, 70 - a.length);
      else if (a.includes(k)) melhor = Math.max(melhor, 40 - a.length);
      else if (k.includes(a)) melhor = Math.max(melhor, 30 - a.length);
    }
    return melhor;
  };
  return S.ingredientes.map(i => [i, pont(i)]).filter(p => p[1] > 0)
    .sort((a, b) => b[1] - a[1]).slice(0, max || 6).map(p => p[0]);
}

/* -------------------- avisos -------------------- */
let toastT = null;
function toast(msg, rotuloAcao, acao){
  const velho = document.getElementById("toast");
  if (velho) velho.remove();
  clearTimeout(toastT);
  const d = document.createElement("div");
  d.id = "toast";
  d.append(msg);
  if (rotuloAcao){
    const b = document.createElement("button");
    b.textContent = rotuloAcao;
    b.onclick = () => { d.remove(); acao(); };
    d.append(b);
  }
  document.body.append(d);
  toastT = setTimeout(() => d.remove(), rotuloAcao ? 7000 : 3200);
}

/* -------------------- helpers de DOM -------------------- */
function el(tag, attrs, ...filhos){
  const n = document.createElement(tag);
  for (const k in (attrs || {})){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  filhos.flat().forEach(f => { if (f !== null && f !== undefined && f !== false) n.append(f); });
  return n;
}
const ico = d => el("span", { html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-.12em">' + d + "</svg>" });

/* -------------------- cálculo das listas -------------------- */
/** soma os ingredientes do cardápio de uma semana, já escalados para a família */
function precisaDaSemana(inicio){
  const soma = {};       // ingredienteId -> quantidade base
  const receitasUsadas = [];
  for (let n = 0; n < 7; n++){
    const k = chaveData(somaDias(inicio, n));
    const dia = S.cardapio[k];
    if (!dia) continue;
    for (const ref of ["almoco","jantar"]){
      if (dia.feito && dia.feito[ref]) continue;      // já cozinhado: já saiu do estoque
      for (const rid of (dia[ref] || [])){
        const r = S.receitas.find(x => x.id === rid);
        if (!r) continue;
        receitasUsadas.push(r.nome);
        const fator = S.config.pessoas / (r.porcoes || 1);
        for (const it of r.itens) soma[it.ing] = (soma[it.ing] || 0) + it.q * fator;
      }
    }
  }
  return { soma, receitasUsadas };
}
function faltaParaLista(soma){
  const itens = [];
  for (const id in soma){
    const ing = ingPorId(id);
    if (!ing) continue;
    const temCasa = (S.estoque[id] || {}).q || 0;
    const falta = soma[id] - temCasa;
    if (falta > 0.01) itens.push({ ing: id, q: compravel(falta, ing), precisa: Math.round(soma[id]), tem: temCasa, marcado: false, preco: "" });
  }
  return itens.sort(ordenaPorCategoria);
}
function ordenaPorCategoria(a, b){
  const ia = ingPorId(a.ing), ib = ingPorId(b.ing);
  const ca = CATEGORIAS.indexOf(ia.categoria), cb = CATEGORIAS.indexOf(ib.categoria);
  return ca - cb || ia.nome.localeCompare(ib.nome, "pt-BR");
}
function gerarRancho(){
  const itens = [];
  for (const id in S.estoque){
    const e = S.estoque[id], ing = ingPorId(id);
    if (!ing || !e.meta) continue;
    const falta = e.meta - (e.q || 0);
    if (falta > 0.01) itens.push({ ing: id, q: compravel(falta, ing), precisa: e.meta, tem: e.q || 0, marcado: false, preco: "" });
  }
  return itens.sort(ordenaPorCategoria);
}
/** ids que aparecem em aberto na outra lista — evita comprar o mesmo arroz duas vezes */
function cruzaOutraLista(qual){
  const outra = S.listas[qual === "semana" ? "rancho" : "semana"];
  if (!outra) return new Set();
  return new Set(outra.itens.filter(i => !i.marcado).map(i => i.ing));
}

/** baixa do estoque o que a refeição consumiu */
function cozinhei(chave, ref){
  const dia = S.cardapio[chave];
  if (!dia || !(dia[ref] || []).length) return;
  const antes = JSON.parse(JSON.stringify(S.estoque));
  let n = 0;
  for (const rid of dia[ref]){
    const r = S.receitas.find(x => x.id === rid);
    if (!r) continue;
    const fator = S.config.pessoas / (r.porcoes || 1);
    for (const it of r.itens){
      const e = S.estoque[it.ing] || (S.estoque[it.ing] = { q: 0, meta: 0 });
      e.q = Math.max(0, Math.round((e.q - it.q * fator) * 100) / 100);
      n++;
    }
  }
  dia.feito = dia.feito || {};
  dia.feito[ref] = true;
  salvar(); render();
  toast(n + " ingredientes baixados do estoque", "Desfazer", () => {
    S.estoque = antes; dia.feito[ref] = false; salvar(); render();
  });
}

/* ---------- editor de receita, com catálogo de ingredientes ---------- */
function editarReceita(r){
  const novo = !r;
  const d = r ? JSON.parse(JSON.stringify(r))
              : { id:"r" + Date.now(), nome:"", categoria:"Prato principal", tempo:30, porcoes:4, itens:[], modo:"" };

  abrirFolha(novo ? "Nova receita" : "Editar receita", folha => {
    const campo = (rot, chave, attrs) => el("label", { class:"campo" }, rot,
      el("input", Object.assign({ value:d[chave], oninput:e => d[chave] = e.target.value }, attrs || {})));

    const caixaItens = el("div", { class:"pilha", style:"gap:7px" });
    function desenhaItens(){
      caixaItens.innerHTML = "";
      if (!d.itens.length) caixaItens.append(el("p", { class:"vazio", style:"padding:10px" }, "Nenhum ingrediente ainda."));
      d.itens.forEach((it, idx) => {
        const ing = ingPorId(it.ing);
        if (!ing) return;
        const us = unidadesDe(ing);
        const sel = el("select", { onchange:e => { it.u = e.target.value; recalc(); } },
          us.map(u => el("option", { value:u[0], selected:(it.u || us[0][0]) === u[0] }, u[0])));
        const inp = el("input", { type:"number", step:"any", min:"0", style:"width:82px;text-align:right",
          value: it.q / (us.find(u => u[0] === (it.u || us[0][0])) || [0,1])[1],
          oninput:e => { it._v = parseFloat(e.target.value) || 0; recalc(); } });
        function recalc(){ it.q = paraBase(it._v !== undefined ? it._v : parseFloat(inp.value) || 0, it.u || us[0][0], ing); }
        caixaItens.append(el("div", { class:"item" },
          el("span", { class:"nome" }, ing.nome, el("small", null, ing.categoria)),
          inp, sel,
          el("button", { class:"btn fant peq", style:"color:var(--falta)", "aria-label":"Remover",
            onclick:() => { d.itens.splice(idx, 1); desenhaItens(); } }, ico(I.lixo))));
      });
    }
    desenhaItens();

    // busca de ingrediente no catálogo
    const busca = el("input", { placeholder:"Digite um ingrediente do catálogo", autocomplete:"off" });
    const sugestoes = el("div", { class:"pilha", style:"gap:5px" });
    busca.addEventListener("input", () => {
      sugestoes.innerHTML = "";
      const txt = busca.value.trim();
      if (!txt) return;
      const achados = sugerir(txt, 5);
      achados.forEach(ing => sugestoes.append(
        el("button", { class:"item", style:"cursor:pointer;width:100%;text-align:left;border-style:dashed", onclick:() => {
          if (!d.itens.some(x => x.ing === ing.id)) d.itens.push({ ing:ing.id, q:0, u:unidadesDe(ing)[0][0] });
          busca.value = ""; sugestoes.innerHTML = ""; desenhaItens();
        } }, el("span", { class:"nome" }, ing.nome, el("small", null, ing.categoria + " · " + ing.tipo)))));
      if (!acharIngrediente(txt))
        sugestoes.append(el("button", { class:"item", style:"cursor:pointer;width:100%;text-align:left;color:var(--acento);border-color:var(--acento)",
          onclick:() => novoIngrediente(txt, ing => {
            d.itens.push({ ing:ing.id, q:0, u:unidadesDe(ing)[0][0] });
            busca.value = ""; sugestoes.innerHTML = ""; desenhaItens();
          }) }, el("span", { class:"nome" }, "Cadastrar “" + txt + "” no catálogo")));
    });

    folha.append(
      el("div", { class:"pilha" },
        campo("Nome do prato", "nome", { placeholder:"Ex.: Frango com quiabo" }),
        el("div", { class:"grade3" },
          el("label", { class:"campo" }, "Categoria",
            el("select", { onchange:e => d.categoria = e.target.value },
              ["Prato principal","Acompanhamento","Entrada","Sobremesa","Lanche","Café da manhã"]
                .map(c => el("option", { selected:d.categoria === c }, c)))),
          campo("Tempo (min)", "tempo", { type:"number", min:"1" }),
          campo("Rende (porções)", "porcoes", { type:"number", min:"1" })),
        el("div", { class:"grupo" },
          el("div", { class:"rotulo" }, "Ingredientes"),
          el("p", { class:"sub", style:"margin:2px 0 8px" }, "Cada item vem do catálogo, não do que você digita — é isso que faz a lista de compras bater com o estoque."),
          caixaItens,
          el("div", { style:"margin-top:9px" }, busca), sugestoes),
        el("label", { class:"campo" }, "Modo de preparo",
          el("textarea", { oninput:e => d.modo = e.target.value }, d.modo)),
        el("button", { class:"btn larg", onclick:() => {
          if (!d.nome.trim()) return toast("Dê um nome à receita");
          if (!d.itens.length) return toast("Adicione pelo menos um ingrediente");
          d.tempo = parseInt(d.tempo) || 30; d.porcoes = parseInt(d.porcoes) || 4;
          d.itens.forEach(it => { delete it._v; });
          const i = S.receitas.findIndex(x => x.id === d.id);
          if (i >= 0) S.receitas[i] = d; else S.receitas.push(d);
          salvar(); fecharFolha(); render(); toast("Receita salva");
        } }, ico(I.check), "Salvar receita"))
    );
  });
}

        });
        folha.append(el("label", { class:"campo" }, "Qual item", busca), sug);
        return;
      }
      const e = S.estoque[ing.id] || { q:0, meta:0 };
      const us = unidadesDe(ing);
      const grande = us[us.length - 1];
      const par = (rot, valor, aoMudar, dica) => {

        const sel = el("select", null, us.map(u => el("option", { value:u[0], selected:u[0] === uSel }, u[0])));
        const ler = () => aoMudar(paraBase(parseFloat(inp.value) || 0, sel.value, ing));
        inp.addEventListener("input", ler); sel.addEventListener("change", ler);
        return el("label", { class:"campo" }, rot, el("div", { class:"linha" }, inp, sel),
          dica ? el("span", { style:"font-weight:400;color:var(--ink3)" }, dica) : null);

        par("Tenho em casa", q, v => q = v),

        el("button", { class:"btn larg", onclick:() => {

          delete S.estoque[ing.id]; salvar(); fecharFolha(); render();
        } }, ico(I.lixo), "Tirar do estoque") : null));
    };
    montar();
  }, true);
}

/* ---------- Compras ---------- */
function gerarSemana(){
  const { soma, receitasUsadas } = precisaDaSemana(daChave(semanaAtiva));
  if (!receitasUsadas.length){ toast("Não há pratos marcados nesta semana"); return; }
  S.listas.semana = { geradaEm: new Date().toISOString(), semana: semanaAtiva, itens: faltaParaLista(soma) };
  abaCompras = "semana"; salvar(); ir("compras");
}
function telaCompras(raiz){
  const lista = S.listas[abaCompras];
  const cruzado = cruzaOutraLista(abaCompras);

  const abas = el("div", { class:"linha", style:"gap:7px" },
    [["semana","Da semana"],["rancho","Rancho do mês"]].map(([k, rot]) =>
      el("button", { class:"btn " + (abaCompras === k ? "" : "sec") + " peq", onclick:() => { abaCompras = k; render(); } }, rot)));

      el("button", { class:"btn peq", onclick:() => {

        else { S.listas.rancho = { geradaEm:new Date().toISOString(), itens:gerarRancho() }; salvar(); render(); }
      } }, lista ? "Refazer" : "Gerar")));

  raiz.append(cabeca, abas);

  if (abaCompras === "rancho"){
    raiz.append(el("p", { class:"sub", style:"margin-top:10px" },

function textoLista(qual){
  const lista = S.listas[qual];

  const porCat = {};
  lista.itens.forEach(it => { const ing = ingPorId(it.ing); if (ing) (porCat[ing.categoria] = porCat[ing.categoria] || []).push({ it, ing }); });
  let t = "*AJHA Control — " + titulo + "*\n";
  CATEGORIAS.filter(c => porCat[c]).forEach(c => {
    t += "\n_" + c + "_\n";
    porCat[c].forEach(({ it, ing }) => { t += (it.marcado ? "✅ " : "▢ ") + ing.nome + " — " + mostrarBase(it.q, ing) + "\n"; });

  return t;

/* -------------------- Firebase -------------------- */
const CHAVE_FB = "ajha-firebase";
/** o que está no arquivo manda; o que foi digitado em Ajustes serve de teste */
function leConfigFb(){
  let guardado = {};
  try { guardado = JSON.parse(localStorage.getItem(CHAVE_FB) || "{}"); } catch (e) {}
  return FIREBASE.apiKey ? Object.assign({}, guardado, FIREBASE) : guardado;
}
function gravaConfigFb(c){ try { localStorage.setItem(CHAVE_FB, JSON.stringify(c)); } catch (e) {} }
const temFirebase = () => { const c = leConfigFb(); return !!(c.apiKey && c.projectId); };

function carregaScript(src){
  return new Promise((ok, erro) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => erro(new Error("não carregou " + src));
    document.head.append(s);
  });
}
async function conectarFirebase(pin){
  const c = leConfigFb();
  if (!c.apiKey || !c.projectId) throw new Error("Falta preencher o Firebase no index.html.");
  if (!window.firebase){
    const base = "https://cdn.jsdelivr.net/npm/firebase@10.12.2/compat/";
    await carregaScript(base + "firebase-app-compat.js");
    await carregaScript(base + "firebase-auth-compat.js");
    await carregaScript(base + "firebase-firestore-compat.js");
  }
  if (!window.firebase) throw new Error("Não consegui carregar o Firebase aqui.");
  if (!firebase.apps.length) firebase.initializeApp({
    apiKey:c.apiKey, authDomain:c.authDomain || (c.projectId + ".firebaseapp.com"),
    projectId:c.projectId, appId:c.appId
  });
  await firebase.auth().signInWithEmailAndPassword(CONTA_FAMILIA, senhaDoPin(pin));
  const db = firebase.firestore();
  const doc = db.collection("familias").doc("ajha");
  const snap = await doc.get();
  fb = { db, doc };
  MODO = "nuvem";
  if (snap.exists && snap.data() && snap.data().ingredientes) S = snap.data();
  else { S = leLocal() || dadosIniciais(); await doc.set(JSON.parse(JSON.stringify(S))); }
  doc.onSnapshot(s => {
    const d = s.data();
    if (!d || !d.ingredientes) return;
    if (JSON.stringify(d) === JSON.stringify(S)) return;
    S = d; guardaLocal(); render();
  });
}

    abrirApp();
    toast("Sincronizado com a família");
  } catch (err) {
    const m = err && err.code || "";
    if (/wrong-password|invalid-credential|user-not-found|invalid-login/.test(m)) erraPin("PIN incorreto.");
    else if (/too-many-requests/.test(m)) erraPin("Muitas tentativas. Espere um pouco.");
    else if (/network/.test(m)) erraPin("Sem internet.");
    else erraPin((err && err.message) || "Não consegui entrar.");
  } finally { porta.classList.remove("ocupada"); }
}
function digita(t){
  if (t === "apaga"){ pinAtual = pinAtual.slice(0, -1); elErroPin.textContent = ""; desenhaPin(); return; }
  if (pinAtual.length >= 4) return;
  pinAtual += t; elErroPin.textContent = ""; desenhaPin();
  if (pinAtual.length === 4) setTimeout(tentaPin, 160);
}
document.getElementById("teclado").addEventListener("click", e => {
  const b = e.target.closest("button[data-t]");
  if (b) digita(b.dataset.t);
});
document.addEventListener("keydown", e => {
  if (document.getElementById("porta").hidden) return;
  if (/^[0-9]$/.test(e.key)) digita(e.key);
  else if (e.key === "Backspace") digita("apaga");
});

document.getElementById("usar-local").addEventListener("click", () => {
  S = leLocal() || dadosIniciais();
  MODO = "local";
  try { localStorage.setItem("ajha-modo", "local"); } catch (e) {}
  abrirApp();
});
document.getElementById("bt-tema").addEventListener("click", alternaTema);
document.getElementById("bt-ajustes").addEventListener("click", () => ir("ajustes"));
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => ir(b.dataset.v)));

function iniciar(estadoQuente){
  if (estadoQuente && estadoQuente.S){ S = estadoQuente.S; MODO = "local"; abrirApp(); return; }
  let modoSalvo = "";
  try { modoSalvo = localStorage.getItem("ajha-modo") || ""; } catch (e) {}
  if (temFirebase() && modoSalvo !== "local"){ abrirPorta(); desenhaPin(); return; }
  S = leLocal() || dadosIniciais();
  abrirApp();
}

if (window.claude && window.claude.hot){
  window.claude.hot.snapshot(() => ({ S }));
  window.claude.hot.ready ? window.claude.hot.ready(iniciar) : iniciar(window.claude.hot.data || {});
} else {
  iniciar(null);
}
</script>

if ("serviceWorker" in navigator) {
  addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
